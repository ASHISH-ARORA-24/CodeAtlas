[project]
name = "codeatlas"
version = "0.1.0"
description = "AI-powered codebase Q&A service — index your repos, ask questions, get answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.14.0",
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.workspace]
members = [
    "source/codeatlas/sample/grade_calculator",
]
